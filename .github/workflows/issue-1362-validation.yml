name: Issue 1362 validation
on:
  push:
    branches: ['verify/1362-nonce-boundaries']
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: 2
jobs:
  module:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/issue-1362-isolated/target
          key: issue-1362-isolated-v1
      - name: Format new tests
        run: rustfmt --check --edition 2021 contracts/credence_delegation/src/test_nonce_boundaries.rs
      - name: Build isolated module fixture
        run: |
          python3 .github/issue-1362-isolate.py
          cargo generate-lockfile --manifest-path /tmp/issue-1362-isolated/Cargo.toml
          cargo update --manifest-path /tmp/issue-1362-isolated/Cargo.toml -p ed25519-dalek@3.0.0 --precise 2.2.0
      - name: Exact module regressions
        run: |
          cargo test --manifest-path /tmp/issue-1362-isolated/Cargo.toml --lib nonce::tests --locked 2>&1 | tee isolated-tests.log
          exit "${PIPESTATUS[0]}"
      - name: Verify original TTL conversion fails the regression
        if: always()
        run: |
          cp /tmp/issue-1362-isolated/src/nonce.rs /tmp/nonce-fixed.rs
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/issue-1362-isolated/src/nonce.rs')
          text = p.read_text()
          assert '.min(u64::from(MAX_TTL))' in text
          p.write_text(text.replace('.min(u64::from(MAX_TTL))', ''))
          PY
          set +e
          cargo test --manifest-path /tmp/issue-1362-isolated/Cargo.toml --lib nonce::tests::expiry_ttl_floor_buffer_cap_and_extreme_timestamps --locked > original-ttl.log 2>&1
          regression_status=$?
          set -e
          cp /tmp/nonce-fixed.rs /tmp/issue-1362-isolated/src/nonce.rs
          cat original-ttl.log
          test "$regression_status" -eq 101
          grep -F 'left: 17280' original-ttl.log
          grep -F 'right: 3110400' original-ttl.log
      - name: Isolated module coverage
        if: always()
        continue-on-error: true
        run: |
          cargo llvm-cov --manifest-path /tmp/issue-1362-isolated/Cargo.toml --lib --locked --lcov --output-path module-coverage.lcov 2>&1 | tee module-coverage.log
          exit "${PIPESTATUS[0]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-1362-isolated-results
          path: |
            *.log
            module-coverage.lcov
